name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Drawings and generated library are up to date
        run: npm run draw && git diff --exit-code packages/library
      - name: Performance budget
        run: npm run bench
      - name: Single-file bundle builds and runs in a bare V8 context
        run: npm run bundle
      - name: Documentation site builds
        run: npm run site
